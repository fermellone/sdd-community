# openspec/config.yaml — SDD project configuration
# Auto-generated by sdd-init. Do not edit manually — re-run sdd-init to update.

schema: spec-driven

context: |
  Project: sdd-community
  Framework: Next.js 16
  Package Manager: pnpm
  Database: NeonDB (PostgreSQL)
  Auth: Clerk (Discord OAuth)
  UI: ShadCN (install via pnpx)
  Architecture: Next.js 16 App Router + Drizzle ORM + ShadCN v4
  Stack Status: Scaffolded — PRs 1-4 implemented

testing:
  strict_tdd: true
  note: >
    Strict TDD enabled by user request. No test runner detected yet
    (project is empty). Test infrastructure must be set up during
    first implementation phase. Candidate: Vitest + Testing Library
    (Next.js 16 convention).
  test_runner: vitest
  test_layers:
    unit: true
    integration: true
    e2e: false
  coverage: true
  linter: biome
  type_checker: typescript
  formatter: biome

chained_pr:
  strategy: ask-always
  review_budget_lines: 800

rules:
  proposal:
    - Include rollback plan for risky changes
    - State what problem is being solved and why
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns once established
    tdd: true
    test_command: "npx vitest run"
  verify:
    test_command: "npx vitest run"
    build_command: "npx next build"
    coverage_threshold: 80
  archive:
    - Warn before merging destructive deltas
